<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>EasyTheSolarSystemUniverse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
  }
  header {
    background: #3a86ff;
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  header .icon { font-size: 28px; }
  header h1 { font-size: 18px; font-weight: bold; }
  header .count { margin-left: auto; font-size: 14px; opacity: 0.9; }
  
  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.3);
  }
  .progress-fill {
    height: 100%;
    background: white;
    transition: width 0.3s;
  }
  
  main { padding: 20px; max-width: 600px; margin: 0 auto; }
  
  .card {
    background: white;
    border-radius: 16px;
    padding: 30px 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    text-align: center;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .question-text {
    font-size: 32px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .hint-text {
    font-size: 14px;
    color: #999;
    margin-top: 4px;
  }
  .answer-box {
    background: #f0f9f0;
    border: 2px solid #3a86ff;
    border-radius: 12px;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    width: 100%;
    margin-top: 12px;
    display: none;
  }
  .answer-box.show { display: block; }
  
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-show {
    background: #3a86ff;
    color: white;
  }
  .btn-correct {
    background: #27ae60;
    color: white;
    display: none;
  }
  .btn-wrong {
    background: #e74c3c;
    color: white;
    display: none;
  }
  .btn-show.hidden { display: none; }
  .btn-correct.show, .btn-wrong.show { display: block; }
  
  .result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .result-screen.show { display: block; }
  .result-icon { font-size: 64px; margin-bottom: 16px; }
  .result-score { font-size: 28px; font-weight: bold; color: #333; margin-bottom: 8px; }
  .result-sub { font-size: 16px; color: #666; margin-bottom: 32px; }
  .btn-restart {
    background: #3a86ff;
    color: white;
    padding: 16px 40px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  
  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 16px;
  }
</style>

<body>

<header>

      <button class="btn btn-wrong" id="btnWrong" onclick="next(false)">✗ もう一度</button>
    </div>
  </div>
  
  <div class="result-screen" id="resultScreen">
    <div class="result-icon">🎉</div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-sub" id="resultSub"></div>
    <button class="btn-restart" onclick="restart()">もう一度挑戦</button>
  </div>
</main>

<script>
const ALL_QUESTIONS = [
  {
    "q": "地球の基本情報\n\n・太陽からの平均距離：1億4,960万km・大きさ（赤道半径）：6,378km・質量：5.974×1024kg・平均密度：5.52g/cm³・公転周期：365.257日・自転周期：0.9973日\n\n太陽系で唯一、水と生物が存在する惑星\n\n地球は太陽から3番目に位置する惑星です。\n直径は約1万3,000km、赤道のまわりは約4万kmあります。地球はよく「水の惑星」と呼ばれ、太陽系の中でも地球にだけ表面に大量の水が存在します。太陽からの距離がほどよいため、水を液体に保っていられるのです。\n　その水のほとんどは海にあり、地球の表面の7割を占め、このおかげで生物が住みやすい環境ができているのです。太陽系8つの惑星と160以上の衛星のなかでも、生物の存在が確認されているのは地球だけです。\n\n自転軸のかたむきによる四季の変化\n\n地球は1年かけて太陽のまわりを公転します。自転軸が公転面に垂直な方向に対して約23.4度かたむいたまま公転するので、季節の変化が見られます。日本の夏には太陽は北半球側から光を当てるので、北半球は暑く、南半球は寒くなります。また日本の冬はその逆で北半球は寒く、南半球は暑くなります。日本の春や秋はその中間にあたるので、ほどよい季節になるわけです。\n大気と水が生物の住める環境にした地球のまわりをとりまく大気は、約500kmの厚さがあります。\n大気のおかげで太陽からの有害な紫外線やX線を通さず、また地上の熱を宇宙に逃がすことがありません。\nまた、大気の中の水蒸気は雨や雪になります　　大気と水とが地上の適度な温度を保ち、生物が住みやすい環境をつくり上げていると言えます。\n\n最も内部構造がわかっている地球\n\n地球は、地震波などを用いて内部の構造が詳細に調べられています。地球の地殻は場所によって厚みが異なり、大陸で平均約50km、海洋で平均約5kmです。大陸地殻は主に花崗岩質、海洋地殻は主に玄武岩質の岩石からできています。地殻の下には深さ約2,900kmまでマントルがあり、主にかんらん岩からできています。マントルの上部は溶けて流動しやすい状態になっており、その上にマントルの最上部と地殻（合わせてプレートと呼ぶ）が乗っています。大陸の移動や地震、火山活動などは、このプレートの動きと密接に関連しています。中心には金属の鉄・ニッケルからなる核があり、固体である内核と液体である外核に分かれています。",
    "hint": "",
    "a": ""
  },
  {
    "q": "磁気圏\n\n地球の核は鉄やニッケルなどの合金でできており、内核が固体、外核が液体となっています。液体の外核のなかで内核が回転運動することによって電流が発生し、地球をひとつの大きな磁石にしていると考えられています。これはダイナモ作用と呼びますが、ダイナモの特徴として磁場の向きが時々反転します。地磁気の南北反転が少なくとも過去数億年にわたって続いてきたことが、地球の岩石に残された残留磁気の測定から分かっています。この地磁気は地球を取り巻いて磁気圏を形成しており、地球の大気だけでは防ぎきれない、生物にとって有害な太陽風や宇宙線などをある程度防ぐバリアの役割を果たしています。また、磁気圏が強い太陽風を受けることで磁気嵐が発生し、地球の極地方でオーロラが見られる原因になります。",
    "hint": "",

  {
    "q": "月の基本情報\n\n・地球からの平均距離：38万4,400km・大きさ（赤道半径）：1,738km・質量（地球に対して）：0.0123倍・平均密度：3.34g/cm³・公転周期：27.322日・自転周期：27.322日\n\n地球のまわりを回る衛星、月\n\n月は地球からいちばん近いところにある天体で、地球のまわりを回る衛星です。地球からの距離は約38万kmで、地球の赤道を1周すると4万kmですから、地球の赤道のまわりを9周半したくらいの距離にあたります。大きさは地球の約4分の1、重さは地球の81分の1ほどです。しかし他の惑星の衛星は、大きくても大きさが10分の1、重さは1000分の1ですので、月は衛星としては地球に比べると割合で非常に大きく、月がどのようにして誕生したかは大きな謎となっています。自転周期と公転周期は同じ27.322日と等しく、地球からはいつもほぼ同じ面しか見ることができません。\n\n月の誕生\n\n月がどのように誕生したかについては、さまざまな説があります。原子惑星系円盤中の塵（ちり）が集まりかたまって地球とともにできた「兄弟説」、地球の自転が現在よりも速かったころ、赤道部分がちぎれて飛び出した「親子説」、地球の近くにきた天体が、地球の引力につかまり月となった「他人説」、地球ができたころに、他の惑星が衝突し、惑星と地球の破片から月が生まれた「ジャイアントインパクト説（巨大衝突説）」などいろいろな仮説あります。現在はジャイアントインパクト説が有力だと考えられています。\n\n凹凸に富む月の表面\n\n月の表面には大きく分けて「海」と呼ばれる黒っぽい平らな部分と、「陸」と呼ばれる白っぽい山や谷の部分があり、隕石との衝突によってできた山の噴火口のような「クレーター」と呼ばれるくぼ地が多数見られます。クレーターは大きいもので直径が300kmを超え、深さも数千mあります。月の裏側は地球からは見ることができず、1959年に旧ソ連の月探査機「ルナ3号」がはじめて撮影に成功しました。表側と似ていますが、「海」と呼ばれる部分が少なく、ほとんどの部分がクレーターで覆われています。特に裏側の南半球には、直径約2,500kmにも及ぶ、南極から赤道域まで達する巨大な窪地（南極エイトケン盆地）があります。月の最高点と最深点の差は約20kmであり、大きさが4倍ある地球の高低差と同じくらいです。\n\n月の裏側\n\n北極や南極には氷の存在は？\n\n月の北極や南極周辺には太陽の光が一年中差し込まない「永久影」と呼ばれる場所があり、昔からここには水の氷があると考えられてきました。\n　1998年3月、NASAの月探査機「ルナ・プロスペクター」は、月の両極付近に、氷が存在する可能性があること示すデータを測定しました。これは、氷の中の水素分子に宇宙線が当たったときに飛び出す中性子を確認したことによるものです。しかし、2008年に日本の月探査機「かぐや」がその地域を撮影したところ、月の表面に氷が存在しているという証拠は見つかりませんでした。ただし、月の地下には氷が存在している可能性も残っており、今後のより詳細な探査が待たれます。",
    "hint": "",
    "a": ""
  },
  {
    "q": "火星の基本情報\n\n・太陽からの平均距離：2億2,794万km・大きさ（赤道半径）：3,396km・質量（地球に対して）：0.1074倍・平均密度：3.93g/cm³・公転周期：1.88089年・自転周期：1.026日・衛星の数：2\n\n地球に似た赤の惑星\n\n火星は地球のすぐ外側を回る惑星です。火星の直径は地球の約半分、質量は10分の1ほどです。\n火星は地球とほぼ同じ24時間37分かけて自転しながら、687日かけて太陽のまわりを公転します。また、火星の自転軸は公転面に垂直な方向に対して25度ほどかたむいているため、地球と同じように四季の変化が見られます\n火星は地球からでも赤く見えますが、これは表面が酸化鉄（赤さび）を多く含む岩石で覆われているからです。表面にはクレーターや火山、峡谷などが見られ、水が流れた跡のような地形も数多く残されています。火星には薄い大気があり、砂嵐も起きます。ときには火星全球を覆うような砂嵐も発生し、「黄雲」と呼ばれ、地上から小さな望遠鏡でもそのようすを観測することができます。\n\n太陽系最大級の山や谷\n\n火星には太陽系最大の火山であるオリンポス山があります。現在は火山活動は確認されていませんが、少なくとも数千万年前頃までは活動していたとみられています。オリンポス山の裾野の直径は約600km、高さは富士山の7倍近い27kmです。また、火星の赤道付近には、これまた太陽系最大級の渓谷、マリネリス峡谷があります。全長が約2,000kmにも及ぶ長大なもので、深いところでは10kmもの深さがあります。\n\n水の氷やドライアイスでできた極冠\n\n火星を望遠鏡で見ると、極地域に白く光る模様を見ることができます。これが極冠と呼ばれるもので、ドライアイスが積もったものです。季節によって大きさが変化し、大気との間で循環が起きていると考えられています。火星探査機「マーズ・エクスプレス」は、極地域の地下、極冠よりもはるかに広い地域に水の氷が含まれるとみられる凍土があることを確認しました。\n\n水が流れてできた地形\n\n現在の火星の表面には、液体の水をたたえる海や川はありません。しかし、水が流れて浸食したような地形が数多く残されています。これはかつて、火星表面に大量の水があったことを物語っています。しかし、火星は地球よりも小さくその重力も小さかったため、蒸発して宇宙に逃げてしまったか、地球よりも寒冷な気候のために地下に氷結してしまったと考えられています。近年、アメリカが打ち上げた火星探査車「オポチュニティ」と「スピリット」によって、水があった環境下で作られたと考えられる鉱物も発見され、また、アメリカが打ち上げた探査機「マーズ･グローバル・サーベイヤー」の撮影した火星表面の写真から、ここ数年で新たに作られたと見られる地下水がしみ出して地表面を流れたような地形が見つかりました。このことから、火星には昔大量の水があり、現在でも地下には氷の形で存在し続けていることが、ほぼ確実視されています。",
    "hint": "",
    "a": ""
  },
  {
    "q": "水星の基本情報\n\n・太陽からの平均距離：5,791万km・大きさ（赤道半径）：2,440km・質量（地球に対して）：0.05527倍・平均密度：5.43g/cm³・公転周期：87.969日・自転周期：58.65日\n\n小さくても重い惑星、水星\n\n水星は太陽系のいちばん内側を回る惑星です。直径は4,880km、月より少し大きいくらいで、地球のおよそ5分の2の大きさです。重さは地球の18分の1です。\n\n固有磁場があり、巨大な核をもつ水星\n\n太陽系内の惑星のなかで地球に次いで密度の高い水星は、その直径の3分の2から4分の3にもなる巨大な核があると考えられています。水星は最も小さな惑星であり、そのため急速に冷えていくため内部は固体であると考えられていましたが、マリナー10号によって微弱ながら水星固有の磁場が発見され、その後の観測より、液体の核をもつ可能性が示唆されています。なぜ水星のような小さい惑星で核が溶けたままいられるのか、大きな謎となっています。\n\n昼と夜の気温差が激しい水星\n\n太陽の最も近くにある水星は、太陽の強烈な光や熱を地球の7倍も受けています。そのため、昼には表面の温度が摂氏400度まで高くなります。しかし、大気がほとんどなく、自転の周期が非常にゆっくりしているので、太陽の側を向いていない夜の面では、熱がほとんど失われてしまいます。そして、夜明け前には温度が摂氏マイナス160度にまで下がってしまうのです。\n\n水星の表面はたくさんのクレーターで覆われている\n\n水星は太陽の近くにあるため、地球からは日没直後と日の出前の短い時間しか見えません。そのため観測しにくく、あまり詳しいことは分かりませんでした。1974年アメリカの惑星探査機「マリナー10号」によって、水星の表面が初めて観測されました。このときの調査で水星の表面は月のように無数のクレーターで覆われていることが分かりました。\n　いちばん大きなクレーターである「カロリス盆地」は直径1,300kmもあり、水星の直径の4分の1以上もあります。\nまた、水星特有の地形として、水星の表面全体に見られるしわのような地形があります。これは高さ2kmを超える断崖で「リンクル・リッジ」と呼ばれています。このような地形は、水星ができたばかりのときには熱かった核が、冷えて収縮した際、星の表面とともに縮んでつくられたと考えられています。",
    "hint": "",
    "a": ""

let questions = [];
let current = 0;
let correct = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  questions = shuffle(ALL_QUESTIONS);
  current = 0;
  correct = 0;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  showQuestion();
}

function showQuestion() {
  if (current >= questions.length) {
    showResult();
    return;
  }
  const q = questions[current];
  document.getElementById('questionText').textContent = q.q || '（問題なし）';
  document.getElementById('hintText').textContent = q.hint ? `【${q.hint}】` : '';
  document.getElementById('answerBox').textContent = q.a || '（答えなし）';
  document.getElementById('answerBox').classList.remove('show');
  document.getElementById('btnShow').classList.remove('hidden');
  document.getElementById('btnCorrect').classList.remove('show');
  document.getElementById('btnWrong').classList.remove('show');
  
  document.getElementById('counter').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
}

function showAnswer() {
  document.getElementById('answerBox').classList.add('show');
  document.getElementById('btnShow').classList.add('hidden');
  document.getElementById('btnCorrect').classList.add('show');
  document.getElementById('btnWrong').classList.add('show');
}

function next(isCorrect) {
  if (isCorrect) correct++;
  current++;
  showQuestion();
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultScreen').classList.add('show');
  const pct = Math.round((correct / questions.length) * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 60 ? '😊' : '📚';
  document.getElementById('resultScreen').querySelector('.result-icon').textContent = emoji;
  document.getElementById('resultScore').textContent = `${correct} / ${questions.length} 正解 (${pct}%)`;
  document.getElementById('resultSub').textContent = 
    pct >= 80 ? 'すばらしい！全問制覇まであと少し！' :
    pct >= 60 ? 'よくできました！あと一息！' : 'もう一度チャレンジしてみよう！';
}

function restart() {
  start();
}

// 起動
if (ALL_QUESTIONS.length === 0) {
  document.querySelector('.card').innerHTML = '<div class="no-data">データがありません</div>';
} else {
  start();
}
