<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名作文学館 - 7,593作品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ef; --paper: #fffef9; --ink: #1c1208;
    --ink-mid: #4a3820; --ink-light: #7a6448;
    --accent: #7a1515; --accent2: #1a4f7a;
    --accent-hover: #5c0f0f;
    --border: #d8c9a8; --border-light: #ede0c8;
    --tag-fl-bg:#e8f0fb;--tag-fl-fg:#1a4080;
    --tag-fs-bg:#e8f5e9;--tag-fs-fg:#1a5a28;
    --tag-jk-bg:#fdf0e0;--tag-jk-fg:#7a3a0a;
    --tag-jm-bg:#fde8e8;--tag-jm-fg:#7a1515;
    --tag-js-bg:#f0e8fd;--tag-js-fg:#3a157a;
    --font-size:15px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-size:var(--font-size);min-height:100vh;line-height:1.7;}

  /* ヘッダー */
  header{background:var(--ink);color:var(--bg);padding:1.8rem 1.5rem 1.4rem;text-align:center;position:relative;}
  header::after{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--accent) 0%,#c8a060 50%,var(--accent) 100%);}
  header h1{font-family:'Noto Serif JP',serif;font-size:clamp(1.5rem,5vw,2.5rem);letter-spacing:0.25em;font-weight:600;margin-bottom:0.3rem;}
  header p{font-size:0.85rem;color:#c0a880;letter-spacing:0.1em;}
  .font-ctrl{position:absolute;top:1rem;right:1.2rem;display:flex;align-items:center;gap:0.4rem;}
  .font-ctrl span{font-size:0.72rem;color:#a08060;}
  .font-btn{padding:0.25rem 0.6rem;border:1px solid #5a4a32;border-radius:4px;background:transparent;color:#c8b090;cursor:pointer;font-family:'Noto Serif JP',serif;transition:all 0.15s;}
  .font-btn:hover{background:#3a2a18;color:#f0d8b0;}
  .font-btn.active-size{background:#5a2020;color:#f0d0a0;border-color:#8a4040;}
  .font-btn.s{font-size:11px;}.font-btn.m{font-size:14px;}.font-btn.l{font-size:18px;}

  /* メイン */
  .container{max-width:1040px;margin:0 auto;padding:1.5rem 1rem;}
  .search-area{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;box-shadow:0 2px 10px rgba(80,50,20,0.08);}
  .search-row{display:flex;gap:0.8rem;margin-bottom:0.9rem;flex-wrap:wrap;}
  .search-input{flex:1;min-width:180px;padding:0.55rem 1rem;border:1px solid var(--border);border-radius:5px;font-family:'Noto Sans JP',sans-serif;font-size:0.92rem;background:var(--bg);color:var(--ink);outline:none;transition:border-color 0.2s;}
  .search-input:focus{border-color:var(--accent2);}
  .search-input::placeholder{color:#b8a07a;}
  .category-row{display:flex;gap:0.45rem;flex-wrap:wrap;}
  .cat-btn{padding:0.35rem 0.85rem;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--ink-mid);font-family:'Noto Sans JP',sans-serif;font-size:0.8rem;cursor:pointer;transition:all 0.18s;white-space:nowrap;}
  .cat-btn:hover{background:var(--border-light);}
  .cat-btn.active{background:var(--accent);color:#fffef9;border-color:var(--accent);}
  .result-count{font-size:0.82rem;color:var(--ink-light);margin-bottom:0.8rem;padding-left:0.2rem;}
  .table-wrap{background:var(--paper);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(80,50,20,0.07);}
  table{width:100%;border-collapse:collapse;font-size:0.92rem;}
  thead{background:var(--ink);color:#ede0c8;}
  thead th{padding:0.65rem 1rem;text-align:left;font-weight:500;letter-spacing:0.06em;font-size:0.82rem;}
  tbody tr{border-bottom:1px solid var(--border-light);transition:background 0.12s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#f5ede0;}
  tbody td{padding:0.6rem 1rem;vertical-align:middle;}
  .title-link{color:var(--ink);text-decoration:none;font-family:'Noto Serif JP',serif;display:flex;align-items:center;gap:0.5rem;transition:color 0.15s;}
  .title-link:hover{color:var(--accent);}
  .title-link:hover .read-badge{opacity:1;}
  .read-badge{display:inline-block;padding:0.15rem 0.55rem;background:var(--accent);color:#fffef9;border-radius:10px;font-size:0.7rem;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
  .td-author{color:var(--ink-light);font-size:0.85rem;}
  .cat-tag{display:inline-block;padding:0.18rem 0.55rem;border-radius:10px;font-size:0.72rem;font-weight:500;white-space:nowrap;}
  .tag-外国文学{background:var(--tag-fl-bg);color:var(--tag-fl-fg);}
  .tag-外国思想社会科学{background:var(--tag-fs-bg);color:var(--tag-fs-fg);}
  .tag-日本古典{background:var(--tag-jk-bg);color:var(--tag-jk-fg);}
  .tag-日本近代文学{background:var(--tag-jm-bg);color:var(--tag-jm-fg);}
  .tag-日本近代思想評論{background:var(--tag-js-bg);color:var(--tag-js-fg);}
  .pagination{display:flex;justify-content:center;align-items:center;gap:0.4rem;margin-top:1.3rem;flex-wrap:wrap;}
  .page-btn{padding:0.38rem 0.75rem;border:1px solid var(--border);border-radius:4px;background:var(--paper);color:var(--ink);cursor:pointer;font-size:0.83rem;font-family:'Noto Sans JP',sans-serif;transition:all 0.15s;}
  .page-btn:hover{background:var(--border-light);}
  .page-btn.active{background:var(--accent);color:#fffef9;border-color:var(--accent);}
  .page-btn:disabled{opacity:0.35;cursor:default;}
  .page-info{font-size:0.82rem;color:var(--ink-light);padding:0 0.2rem;}
  #loading{text-align:center;padding:4rem 2rem;color:var(--ink-light);font-family:'Noto Serif JP',serif;font-size:1rem;letter-spacing:0.1em;}

  /* ===== モーダル（作品詳細） ===== */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,12,4,0.7);z-index:100;align-items:center;justify-content:center;padding:1rem;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--paper);border-radius:12px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,12,4,0.4);border:1px solid var(--border);overflow:hidden;}
  .modal-header{background:var(--ink);color:#ede0c8;padding:1.1rem 1.4rem;display:flex;align-items:flex-start;gap:1rem;}
  .modal-header-text{flex:1;}
  .modal-title{font-family:'Noto Serif JP',serif;font-size:1.1rem;font-weight:600;line-height:1.4;margin-bottom:0.2rem;}
  .modal-author{font-size:0.82rem;color:#a08060;}
  .modal-close{background:transparent;border:1px solid #5a4a32;color:#a08060;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
  .modal-close:hover{background:#3a2a18;color:#f0d8b0;}
  .modal-body{padding:1.4rem;overflow-y:auto;flex:1;}
  .modal-info{background:var(--bg);border:1px solid var(--border-light);border-radius:8px;padding:1rem 1.2rem;margin-bottom:1.2rem;font-size:0.88rem;color:var(--ink-mid);line-height:1.9;}

  /* ===== 速読ボタン ===== */
  .btn-sokudoku{display:flex;align-items:center;justify-content:center;gap:0.6rem;width:100%;padding:0.9rem 1.5rem;background:var(--accent);color:#fffef9;border:none;border-radius:8px;font-family:'Noto Serif JP',serif;font-size:1rem;letter-spacing:0.08em;cursor:pointer;text-decoration:none;transition:background 0.18s;margin-bottom:0.8rem;}
  .btn-sokudoku:hover{background:var(--accent-hover);}
  .btn-read{display:flex;align-items:center;justify-content:center;gap:0.6rem;width:100%;padding:0.75rem 1.5rem;background:var(--accent2);color:#fffef9;border:none;border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:0.88rem;cursor:pointer;text-decoration:none;transition:background 0.18s;margin-bottom:0.6rem;}
  .btn-read:hover{background:#143d5f;}
  .btn-search-aozora{display:flex;align-items:center;justify-content:center;gap:0.6rem;width:100%;padding:0.65rem 1.5rem;background:transparent;color:var(--accent2);border:1px solid var(--accent2);border-radius:8px;font-family:'Noto Sans JP',sans-serif;font-size:0.85rem;cursor:pointer;text-decoration:none;transition:all 0.18s;}
  .btn-search-aozora:hover{background:rgba(26,79,122,0.06);}
  .modal-note{margin-top:0.9rem;font-size:0.75rem;color:var(--ink-light);text-align:center;line-height:1.7;}

  /* ===== 速読オーバーレイ ===== */
  .reading-overlay{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;}
  .reading-overlay.show{display:flex;}
  .reading-topbar{background:var(--ink);color:#ede0c8;padding:0.7rem 1rem;display:flex;align-items:center;gap:0.8rem;flex-shrink:0;}
  .rt-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;background:rgba(255,255,255,0.08);border:none;color:#ede0c8;transition:background 0.15s;}
  .rt-btn:hover{background:rgba(255,255,255,0.18);}
  .rt-title{flex:1;font-family:'Noto Serif JP',serif;font-size:0.95rem;font-weight:600;letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rt-page{font-size:0.75rem;color:#a08060;white-space:nowrap;}

  /* 速読ステージ */
  .reading-stage{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .ribbon-track{position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(200,160,96,0.2);}
  .ribbon-fill{width:100%;background:var(--accent);transition:height 0.3s;height:0%;}
  .page-paper{flex:1;overflow-y:auto;padding:2rem 2rem 2rem 2.4rem;font-family:'Noto Serif JP',serif;font-size:18px;line-height:2.0;color:var(--ink);background:var(--paper);}
  .page-paper .marker-ch{background:#ffe066;border-radius:2px;transition:background 0.1s;}

  /* 速読コントロールバー */
  .reading-ctrl{background:var(--ink);padding:0.7rem 1rem;flex-shrink:0;}
  .speed-row{display:flex;gap:0.4rem;margin-bottom:0.6rem;justify-content:center;}
  .speed-btn{padding:0.3rem 0.7rem;border-radius:14px;border:1px solid #5a4a32;background:transparent;color:#a08060;font-size:0.75rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.15s;}
  .speed-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .ctrl-btns{display:flex;gap:0.5rem;justify-content:center;align-items:center;}
  .nav-btn{padding:0.45rem 1rem;border:1px solid #5a4a32;border-radius:6px;background:transparent;color:#c8b090;font-size:0.82rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.15s;}
  .nav-btn:hover{background:#3a2a18;}
  .play-btn{padding:0.5rem 1.5rem;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background 0.15s;}
  .play-btn:hover{background:var(--accent-hover);}

  /* 設定モーダル（速読用） */
  .r-modal-backdrop{position:fixed;inset:0;background:rgba(20,12,4,0.5);z-index:300;display:none;align-items:flex-end;justify-content:center;}
  .r-modal-backdrop.show{display:flex;}
  .r-modal-sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:1.5rem 1.2rem 2rem;max-height:80vh;overflow-y:auto;}
  .r-modal-sheet h3{font-family:'Noto Serif JP',serif;font-size:1rem;margin-bottom:1rem;color:var(--ink);}
  .setting-block{margin-bottom:1.2rem;}
  .setting-label{font-size:0.72rem;font-weight:700;color:var(--ink-light);margin-bottom:0.5rem;letter-spacing:0.08em;}
  .font-row,.bg-row{display:flex;gap:0.5rem;}
  .font-opt{flex:1;text-align:center;padding:0.6rem 0;border-radius:8px;border:1.5px solid var(--border);background:var(--paper);cursor:pointer;font-family:'Noto Serif JP',serif;color:var(--ink);}
  .font-opt.active{border-color:var(--ink);background:var(--ink);color:#fff;}
  .bg-opt{flex:1;height:36px;border-radius:8px;border:2px solid var(--border);cursor:pointer;}
  .bg-opt.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(26,79,122,0.2);}
  .r-modal-close{width:100%;padding:0.8rem;border-radius:8px;border:none;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;margin-top:0.5rem;font-family:'Noto Sans JP',sans-serif;}

  /* 読了トースト */
  .finish-toast{position:absolute;inset:0;background:rgba(28,18,8,0.9);color:#fffef9;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;z-index:2;}
  .finish-toast.show{display:flex;}
  .finish-toast h2{font-family:'Noto Serif JP',serif;font-size:1.3rem;margin-bottom:0.5rem;}
  .finish-toast p{font-size:0.85rem;opacity:0.8;margin-bottom:1.2rem;}
  .finish-toast button{padding:0.7rem 1.8rem;border-radius:20px;border:none;background:#fffef9;color:var(--ink);font-weight:700;font-size:0.88rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}

  footer{text-align:center;padding:2rem;color:var(--ink-light);font-size:0.78rem;border-top:1px solid var(--border-light);margin-top:2rem;letter-spacing:0.08em;}
  @media(max-width:640px){
    thead th:nth-child(3){display:none;}
    tbody td:nth-child(3){display:none;}
    .font-ctrl span{display:none;}
    .page-paper{padding:1.2rem 1.2rem 1.2rem 1.6rem;font-size:16px;}
  }
</style>
</head>
<body>

<header>
  <h1>📚 名作文学館</h1>
  <p>7,593作品 収録 ／ カテゴリー・著者・作品名で検索</p>
  <div class="font-ctrl">
    <span>文字</span>
    <button class="font-btn s" id="fsSmall" onclick="setFont(13)">小</button>
    <button class="font-btn m active-size" id="fsMid" onclick="setFont(16)">中</button>
    <button class="font-btn l" id="fsLarge" onclick="setFont(20)">大</button>
  </div>
</header>

<div class="container">
  <div class="search-area">
    <div class="search-row">
      <input class="search-input" id="titleSearch" type="text" placeholder="📖 作品名で検索..." oninput="doSearch()">
      <input class="search-input" id="authorSearch" type="text" placeholder="✍️ 著者名で検索..." oninput="doSearch()">
    </div>
    <div class="category-row">
      <button class="cat-btn active" onclick="setCategory('')" id="cat-all">すべて</button>
      <button class="cat-btn" onclick="setCategory('外国文学')" id="cat-外国文学">外国文学</button>
      <button class="cat-btn" onclick="setCategory('外国思想・社会科学')" id="cat-外国思想・社会科学">外国思想・社会科学</button>
      <button class="cat-btn" onclick="setCategory('日本古典')" id="cat-日本古典">日本古典</button>
      <button class="cat-btn" onclick="setCategory('日本近代文学')" id="cat-日本近代文学">日本近代文学</button>
      <button class="cat-btn" onclick="setCategory('日本近代思想・評論')" id="cat-日本近代思想・評論">日本近代思想・評論</button>
    </div>
  </div>

  <div id="loading">データを読み込み中…</div>
  <div id="main" style="display:none">
    <div class="result-count" id="resultCount"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:48%">作品名</th>
            <th style="width:28%">著者</th>
            <th style="width:24%">カテゴリー</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<footer>名作文学館 ／ 収録作品数 7,593 ／ 本文は青空文庫にリンクしています</footer>

<!-- 作品詳細モーダル -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-header-text">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-author" id="modalAuthor"></div>
      </div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-info" id="modalInfo"></div>
      <button class="btn-sokudoku" id="btnSokudoku" onclick="openReading()">
        ⚡ この作品を速読する
      </button>
      <a class="btn-read" id="btnRead" href="#" target="_blank" rel="noopener">
        📖 青空文庫で全文を読む
      </a>
      <a class="btn-search-aozora" id="btnSearch" href="#" target="_blank" rel="noopener">
        🔍 青空文庫で著者の作品を探す
      </a>
      <p class="modal-note">
        ※ 速読機能はサンプル文を自動表示します<br>
        ※ 全文は青空文庫（aozora.gr.jp）でお読みください
      </p>
    </div>
  </div>
</div>

<!-- 速読オーバーレイ -->
<div class="reading-overlay" id="readingOverlay">
  <div class="reading-topbar">
    <button class="rt-btn" id="backBtn">←</button>
    <div class="rt-title" id="rtTitle"></div>
    <div class="rt-page" id="pageIndicator"></div>
    <button class="rt-btn" id="readingSettingsBtn">⚙</button>
  </div>
  <div class="reading-stage">
    <div class="ribbon-track"><div class="ribbon-fill" id="ribbonFill"></div></div>
    <div class="page-paper" id="pagePaper"></div>
    <div class="finish-toast" id="finishToast">
      <h2>読了しました 📖</h2>
      <p id="finishSub"></p>
      <button id="finishBackBtn">作品一覧へ戻る</button>
    </div>
  </div>
  <div class="reading-ctrl">
    <div class="speed-row" id="speedRow"></div>
    <div class="ctrl-btns">
      <button class="nav-btn" id="prevBtn">◀ 前へ</button>
      <button class="play-btn" id="playBtn">自動送り ▶</button>
      <button class="nav-btn" id="nextBtn">次へ ▶</button>
    </div>
  </div>
</div>

<!-- 速読設定モーダル -->
<div class="r-modal-backdrop" id="settingsModal">
  <div class="r-modal-sheet">
    <h3>⚙ 表示設定</h3>
    <div class="setting-block">
      <div class="setting-label">文字サイズ</div>
      <div class="font-row" id="fontRow"></div>
    </div>
    <div class="setting-block">
      <div class="setting-label">背景色</div>
      <div class="bg-row" id="bgRow"></div>
    </div>
    <button class="r-modal-close" id="settingsCloseBtn">閉じる</button>
  </div>
</div>

<script>
// ===== 基本データ =====
let allWorks = [];
let filtered = [];
let currentPage = 1;
const PER_PAGE = 50;
let currentCategory = '';
let currentWork = null;

// ===== 速読設定 =====
const SPEEDS = [
  { key:0, label:'ゆっくり', cpm:300 },
  { key:1, label:'ふつう',   cpm:600 },
  { key:2, label:'速い',     cpm:1000 },
  { key:3, label:'かなり速い', cpm:1800 },
  { key:4, label:'最速',     cpm:5700 },
];
const FONT_SIZES = [16, 18, 22, 26];
const BG_OPTIONS = [
  { key:0, bg:'#fffef9', fg:'#1c1208' },
  { key:1, bg:'#fbe9ce', fg:'#3b2b1b' },
  { key:2, bg:'#4a4a4a', fg:'#f2f2f2' },
  { key:3, bg:'#101010', fg:'#e7e7e7' },
];

function loadSettings(){ try{ return JSON.parse(localStorage.getItem('lib_settings'))||{speed:1,font:1,bg:0}; }catch(e){ return {speed:1,font:1,bg:0}; } }
function saveSettings(){ localStorage.setItem('lib_settings', JSON.stringify(settings)); }
let settings = loadSettings();

// ===== 速読エンジン =====
let activeChunks = [];
let pageIdx = 0;
let autoPlaying = false;
let autoTimer = null;
let markerRAF = null;
let markerSpans = [];
let markerRange = [-1, -1];

function computeDurationMs(len, speedKey){
  const cpm = SPEEDS[speedKey].cpm;
  return Math.max(900, Math.min((len/cpm)*60000, 14000));
}
function clearMarker(){ if(markerRAF) cancelAnimationFrame(markerRAF); markerRAF=null; setMarkerRange(-1,-1); }
function setMarkerRange(start, end){
  const [oldStart,oldEnd] = markerRange;
  for(let i=oldStart;i<oldEnd;i++){ if(i<start||i>=end) markerSpans[i]&&markerSpans[i].classList.remove('marker-ch'); }
  for(let i=start;i<end;i++){ markerSpans[i]&&markerSpans[i].classList.add('marker-ch'); }
  markerRange=[start,end];
}
function startMarker(text){
  if(markerRAF) cancelAnimationFrame(markerRAF);
  const total=markerSpans.length;
  if(!total) return;
  const duration=computeDurationMs(text.length,settings.speed);
  const windowSize=Math.max(2,Math.round(total/40));
  const startTime=performance.now();
  function tick(now){
    const frac=Math.min(1,(now-startTime)/duration);
    const idx=Math.min(total-1,Math.floor(frac*total));
    setMarkerRange(idx,Math.min(total,idx+windowSize));
    markerRAF=(frac<1)?requestAnimationFrame(tick):null;
  }
  markerRAF=requestAnimationFrame(tick);
}

function showPage(idx, animate){
  if(idx<0) idx=0;
  if(idx>=activeChunks.length) idx=activeChunks.length-1;
  pageIdx=idx;
  const paper=document.getElementById('pagePaper');
  const text=activeChunks[idx];
  paper.innerHTML='';
  const frag=document.createDocumentFragment();
  markerSpans=Array.from(text).map(ch=>{ const s=document.createElement('span'); s.textContent=ch; frag.appendChild(s); return s; });
  markerRange=[-1,-1];
  paper.appendChild(frag);
  paper.scrollTop=0;
  document.getElementById('pageIndicator').textContent=`${idx+1} / ${activeChunks.length}`;
  document.getElementById('ribbonFill').style.height=`${Math.round(((idx+1)/activeChunks.length)*100)}%`;
  startMarker(text);
  if(idx===activeChunks.length-1){
    document.getElementById('finishSub').textContent=`「${currentWork.t}」を読み終えました。おつかれさまでした！`;
    setTimeout(()=>{ document.getElementById('finishToast').classList.add('show'); pauseAuto(); },400);
  }
}

function startAuto(){ autoPlaying=true; document.getElementById('playBtn').textContent='⏸ 一時停止'; scheduleNext(); }
function pauseAuto(){ autoPlaying=false; document.getElementById('playBtn').textContent='自動送り ▶'; clearInterval(autoTimer); }
function scheduleNext(){
  clearInterval(autoTimer);
  if(pageIdx>=activeChunks.length-1){ pauseAuto(); return; }
  const ms=computeDurationMs(activeChunks[pageIdx].length,settings.speed);
  autoTimer=setTimeout(()=>{ if(!autoPlaying) return; showPage(pageIdx+1,true); scheduleNext(); },ms);
}

document.getElementById('prevBtn').onclick=()=>{ pauseAuto(); showPage(pageIdx-1,true); };
document.getElementById('nextBtn').onclick=()=>{ pauseAuto(); showPage(pageIdx+1,true); };
document.getElementById('playBtn').onclick=()=>{ if(autoPlaying){pauseAuto();}else{startAuto();} };
document.getElementById('backBtn').onclick=closeReading;
document.getElementById('finishBackBtn').onclick=closeReading;

function renderSpeedRow(){
  const row=document.getElementById('speedRow');
  row.innerHTML='';
  SPEEDS.forEach(s=>{
    const btn=document.createElement('div');
    btn.className='speed-btn'+(settings.speed===s.key?' active':'');
    btn.textContent=s.label;
    btn.onclick=()=>{ settings.speed=s.key; saveSettings(); renderSpeedRow(); if(autoPlaying)scheduleNext(); if(activeChunks.length)startMarker(activeChunks[pageIdx]); };
    row.appendChild(btn);
  });
}

function applyReadingStyles(){
  const bg=BG_OPTIONS[settings.bg];
  const paper=document.getElementById('pagePaper');
  paper.style.background=bg.bg;
  paper.style.color=bg.fg;
  paper.style.fontSize=FONT_SIZES[settings.font]+'px';
}

function renderSettingsModal(){
  const fontRow=document.getElementById('fontRow');
  fontRow.innerHTML='';
  ['小','中','大','特大'].forEach((label,i)=>{
    const opt=document.createElement('div');
    opt.className='font-opt'+(settings.font===i?' active':'');
    opt.style.fontSize=(14+i*3)+'px';
    opt.textContent=label;
    opt.onclick=()=>{ settings.font=i; saveSettings(); applyReadingStyles(); renderSettingsModal(); };
    fontRow.appendChild(opt);
  });
  const bgRow=document.getElementById('bgRow');
  bgRow.innerHTML='';
  BG_OPTIONS.forEach(o=>{
    const opt=document.createElement('div');
    opt.className='bg-opt'+(settings.bg===o.key?' active':'');
    opt.style.background=o.bg;
    opt.onclick=()=>{ settings.bg=o.key; saveSettings(); applyReadingStyles(); renderSettingsModal(); };
    bgRow.appendChild(opt);
  });
}

document.getElementById('readingSettingsBtn').onclick=()=>{ renderSettingsModal(); document.getElementById('settingsModal').classList.add('show'); };
document.getElementById('settingsCloseBtn').onclick=()=>document.getElementById('settingsModal').classList.remove('show');

// ===== 速読オープン =====
function openReading(){
  if(!currentWork) return;
  closeModalBtn();
  // サンプルテキストを生成（作品名・著者名ベース）
  const sampleText = generateSampleText(currentWork);
  // 200文字ずつのチャンクに分割
  activeChunks = [];
  for(let i=0;i<sampleText.length;i+=200){
    activeChunks.push(sampleText.slice(i,i+200));
  }
  if(activeChunks.length===0) activeChunks=['（本文データがありません）'];
  pageIdx=0; autoPlaying=false;
  clearInterval(autoTimer); clearMarker();
  document.getElementById('finishToast').classList.remove('show');
  document.getElementById('rtTitle').textContent=currentWork.t;
  document.getElementById('playBtn').textContent='自動送り ▶';
  applyReadingStyles();
  renderSpeedRow();
  showPage(0,false);
  document.getElementById('readingOverlay').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeReading(){
  clearInterval(autoTimer); clearMarker();
  document.getElementById('readingOverlay').classList.remove('show');
  document.body.style.overflow='';
}

// サンプルテキスト生成（将来サーバー版では実際の本文に置き換え）
function generateSampleText(work){
  return `【${work.t}】\n著者：${work.a}\nカテゴリー：${work.c}\n\n` +
    `この作品は青空文庫に収録されている名作です。\n` +
    `速読トレーニングをご利用いただきありがとうございます。\n\n` +
    `現在、本文データはヘテムルサーバーへの移行準備中です。\n` +
    `移行完了後は、実際の本文をこちらでお読みいただけます。\n\n` +
    `それまでの間は、下記の「青空文庫で全文を読む」ボタンから\n` +
    `全文をお楽しみください。\n\n` +
    `「${work.t}」は${work.a}の代表的な作品のひとつです。\n` +
    `ぜひ全文をお読みください。`;
}

// ===== 文字サイズ（一覧用） =====
function setFont(size){
  document.documentElement.style.setProperty('--font-size',size+'px');
  ['Small','Mid','Large'].forEach(k=>document.getElementById('fs'+k).classList.remove('active-size'));
  if(size===13)document.getElementById('fsSmall').classList.add('active-size');
  else if(size===16)document.getElementById('fsMid').classList.add('active-size');
  else document.getElementById('fsLarge').classList.add('active-size');
}

// ===== タグクラス =====
function tagClass(cat){ return 'tag-'+cat.replace(/[・]/g,'').replace(/　/g,''); }

// ===== テーブル描画 =====
function renderTable(){
  const tbody=document.getElementById('tbody');
  const start=(currentPage-1)*PER_PAGE;
  const end=start+PER_PAGE;
  const page=filtered.slice(start,end);
  tbody.innerHTML=page.map(w=>`
    <tr>
      <td><a class="title-link" href="#" onclick="openModal(event,${JSON.stringify(w).replace(/"/g,'&quot;')})">${escHtml(w.t)}<span class="read-badge">読む</span></a></td>
      <td class="td-author">${escHtml(w.a)}</td>
      <td><span class="cat-tag ${tagClass(w.c)}">${escHtml(w.c)}</span></td>
    </tr>`).join('');
  document.getElementById('resultCount').textContent=`${filtered.length.toLocaleString()} 件 （${start+1}〜${Math.min(end,filtered.length)} 件表示）`;
  renderPagination();
}

// ===== ページネーション =====
function renderPagination(){
  const total=Math.ceil(filtered.length/PER_PAGE);
  const pg=document.getElementById('pagination');
  if(total<=1){pg.innerHTML='';return;}
  let html=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>◀ 前へ</button>`;
  const range=new Set([1]);
  for(let i=Math.max(2,currentPage-2);i<=Math.min(total-1,currentPage+2);i++) range.add(i);
  range.add(total);
  let prev=0;
  for(const p of [...range].sort((a,b)=>a-b)){
    if(p-prev>1) html+=`<span class="page-info">…</span>`;
    html+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    prev=p;
  }
  html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>次へ ▶</button>`;
  html+=`<span class="page-info">${currentPage} / ${total} ページ</span>`;
  pg.innerHTML=html;
}
function goPage(p){
  const total=Math.ceil(filtered.length/PER_PAGE);
  if(p<1||p>total) return;
  currentPage=p; renderTable();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 検索 =====
function doSearch(){
  const title=document.getElementById('titleSearch').value.trim();
  const author=document.getElementById('authorSearch').value.trim();
  filtered=allWorks.filter(w=>{
    const matchCat=currentCategory===''||w.c===currentCategory;
    const matchTitle=title===''||w.t.includes(title);
    const matchAuthor=author===''||w.a.includes(author);
    return matchCat&&matchTitle&&matchAuthor;
  });
  currentPage=1; renderTable();
}
function setCategory(cat){
  currentCategory=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  const id=cat===''?'cat-all':'cat-'+cat;
  const btn=document.getElementById(id);
  if(btn) btn.classList.add('active');
  doSearch();
}

// ===== モーダル =====
function openModal(event,work){
  event.preventDefault();
  currentWork=work;
  document.getElementById('modalTitle').textContent=work.t;
  document.getElementById('modalAuthor').textContent='著者：'+work.a;
  document.getElementById('modalInfo').innerHTML=`<strong>作品名：</strong>${work.t}<br><strong>著者名：</strong>${work.a}<br><strong>カテゴリー：</strong>${work.c}`;
  document.getElementById('btnRead').href='https://www.google.com/search?q='+encodeURIComponent('site:aozora.gr.jp '+work.t+' '+work.a);
  document.getElementById('btnSearch').href='https://www.aozora.gr.jp/index_pages/person_search.html#q='+encodeURIComponent(work.a);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModalBtn(){ document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow=''; }
function closeModal(event){ if(event.target===document.getElementById('modalOverlay')) closeModalBtn(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModalBtn(); closeReading(); } });

// ===== ユーティリティ =====
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== データ読み込み =====
fetch('works.json')
  .then(r=>r.json())
  .then(data=>{
    allWorks=data; filtered=allWorks;
    document.getElementById('loading').style.display='none';
    document.getElementById('main').style.display='block';
    renderTable();
    window.speechSynthesis&&window.speechSynthesis.getVoices();
  })
  .catch(()=>{ document.getElementById('loading').textContent='データの読み込みに失敗しました。'; });
</script>
