.stat-label { font-size:11px; opacity:0.7; }

.search-box { max-width:600px; margin:16px auto; padding:0 16px; }

.filter-label { font-size:12px; color:#666; margin-right:4px; }
.tab { padding:6px 14px; border-radius:50px; border:2px solid #3498db; background:white; color:#3498db; font-size:13px; font-weight:bold; cursor:pointer; transition:all 0.2s; }
.tab.active { background:#3498db; color:white; }
.grade-bar { max-width:900px; margin:0 auto 8px; padding:0 16px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.grade-btn { padding:5px 12px; border-radius:50px; border:2px solid #95a5a6; background:white; color:#666; font-size:12px; font-weight:bold; cursor:pointer; }
.grade-btn.active { background:#2c3e50; color:white; border-color:#2c3e50; }
.progress-filter { max-width:900px; margin:0 auto 8px; padding:0 16px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.pf-btn { padding:5px 12px; border-radius:50px; border:2px solid #2ecc71; background:white; color:#27ae60; font-size:12px; font-weight:bold; cursor:pointer; }
.pf-btn.active { background:#27ae60; color:white; }
.result-info { max-width:900px; margin:0 auto 8px; padding:0 16px; font-size:13px; color:#666; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:12px; max-width:900px; margin:0 auto; padding:0 16px 40px; }
.app-card { background:white; border-radius:14px; padding:16px 12px 12px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.08); cursor:pointer; transition:transform 0.2s,box-shadow 0.2s; text-decoration:none; color:inherit; display:block; border-top:4px solid #ddd; position:relative; }
.app-card:hover { transform:translateY(-4px); box-shadow:0 6px 20px rgba(0,0,0,0.15); }
.serial { position:absolute; top:6px; right:8px; font-size:10px; color:#bbb; font-weight:bold; }
.app-icon { font-size:30px; margin-bottom:6px; display:block; }
.app-name { font-size:12px; font-weight:bold; color:#333; line-height:1.4; margin-bottom:6px; }
.app-meta { display:flex; justify-content:center; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.badge { font-size:10px; padding:2px 6px; border-radius:10px; font-weight:bold; }
.badge-cat { background:#eaf4fb; color:#2980b9; }
.badge-grade { background:#eafaf1; color:#27ae60; }
.badge-count { background:#fef9e7; color:#f39c12; }
.card-progress { height:4px; background:#eee; border-radius:2px; margin-top:6px; }
.card-progress-fill { height:100%; background:#2ecc71; border-radius:2px; transition:width 0.3s; }
.card-done { position:absolute; top:6px; left:8px; font-size:14px; }
.no-result { text-align:center; padding:60px; color:#999; font-size:16px; grid-column:1/-1; }
.border-国語 { border-top-color:#e74c3c; }
.border-英語 { border-top-color:#3498db; }

.reset-btn { background:#e74c3c; color:white; border:none; padding:8px 16px; border-radius:8px; font-size:12px; cursor:pointer; margin-left:auto; }

const CATS = ['すべて','国語','英語','算数・数学','理科','社会','歴史','芸術','文学'];
const GRADES = ['すべて','小学','中学','高校','その他'];
const GRADE_COLORS = {'小学':'#27ae60','中学':'#2980b9','高校':'#8e44ad','その他':'#7f8c8d'};
const PROGRESS_KEY = 'library_progress';
let currentCat = 'すべて';
let currentGrade = 'すべて';
let currentProgress = 'すべて';

function getProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch {}
}
function markDone(appId) {
  const p = getProgress();
  p[appId] = true;
  saveProgress(p);
  updateStats();
  filterApps();
}
function resetProgress() {
  if(!confirm('進捗をリセットしますか？')) return;
  localStorage.removeItem(PROGRESS_KEY);
  updateStats();
  filterApps();
}

function updateStats() {
  const p = getProgress();
  const done = APPS.filter(a => p[a.id]).length;
  document.getElementById('doneApps').textContent = done;
  document.getElementById('totalProgress').style.width = (done/APPS.length*100)+'%';
  const total = APPS.reduce((s,a)=>s+a.count,0);
  document.getElementById('totalQ').textContent = total.toLocaleString();
}

function init() {
  updateStats();

  const catDiv = document.getElementById('catTabs');
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab'+(c==='すべて'?' active':'');
    btn.textContent = c;
    btn.onclick = () => { currentCat=c; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); filterApps(); };
    catDiv.appendChild(btn);
  });

  const gradeDiv = document.getElementById('gradeTabs');
  GRADES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'grade-btn'+(g==='すべて'?' active':'');
    btn.textContent = g;
    btn.onclick = () => { currentGrade=g; document.querySelectorAll('.grade-btn').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); filterApps(); };
    gradeDiv.appendChild(btn);
  });

  const pfDiv = document.getElementById('progressTabs');
  [['すべて','すべて'],['未学習','未学習'],['学習済み','学習済み']].forEach(([label,val]) => {
    const btn = document.createElement('button');
    btn.className = 'pf-btn'+(val==='すべて'?' active':'');
    btn.textContent = label;
    btn.onclick = () => { currentProgress=val; document.querySelectorAll('.pf-btn').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); filterApps(); };
    pfDiv.appendChild(btn);
  });

  filterApps();
}

function filterApps() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const p = getProgress();
  const filtered = APPS.filter(a => {
    const matchCat = currentCat==='すべて' || a.cat===currentCat;
    const matchGrade = currentGrade==='すべて' || a.grade===currentGrade;
    const matchQ = !q || a.name.toLowerCase().includes(q) || String(a.no).includes(q) || a.cat.includes(q) || a.grade.includes(q);
    const isDone = !!p[a.id];
    const matchProg = currentProgress==='すべて' || (currentProgress==='学習済み'&&isDone) || (currentProgress==='未学習'&&!isDone);
    return matchCat && matchGrade && matchQ && matchProg;
  });

  document.getElementById('showCount').textContent = filtered.length;
  document.getElementById('resultInfo').textContent = filtered.length+'件表示中';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(filtered.length===0){ grid.innerHTML='<div class="no-result">見つかりませんでした</div>'; return; }

  filtered.forEach(a => {
    const isDone = !!p[a.id];
    const gradeColor = GRADE_COLORS[a.grade]||'#999';
    const serial = String(a.no).padStart(3,'0');
    const card = document.createElement('div');
    card.className = `app-card border-${a.cat}`;
    if(isDone) card.style.opacity='0.6';
    card.innerHTML = `
      <span class="serial">[${serial}]</span>
      ${isDone?'<span class="card-done">✅</span>':''}
      <span class="app-icon">${a.icon}</span>
      <div class="app-name">${a.name}</div>
      <div class="app-meta">
        <span class="badge badge-cat">${a.cat}</span>
        <span class="badge badge-grade" style="background:${gradeColor}22;color:${gradeColor}">${a.grade}</span>
        ${a.count>0?`<span class="badge badge-count">${a.count}問</span>`:''}
      </div>
      <div class="card-progress"><div class="card-progress-fill" style="width:${isDone?100:0}%"></div></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <a href="./${a.id}/" target="_blank" style="flex:2;padding:7px;background:#3498db;color:white;border-radius:8px;font-size:12px;font-weight:bold;text-decoration:none;text-align:center">開く</a>
        <button onclick="event.stopPropagation();markDone('${a.id}')" style="flex:1;padding:7px;background:${isDone?'#95a5a6':'#2ecc71'};color:white;border:none;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer">${isDone?'済':'完了'}</button>
      </div>`;
    grid.appendChild(card);
  });
}

init();
</script>
