<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #f0f4f8;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #2c3e50, #3498db);
  color: white;
  padding: 30px 20px;
  text-align: center;
}
header h1 { font-size: 28px; margin-bottom: 8px; }
header p { font-size: 16px; opacity: 0.8; }
.search-box {
  max-width: 600px;
  margin: 20px auto;
  padding: 0 16px;
}
.search-box input {
  width: 100%;
  padding: 14px 20px;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  outline: none;
}
.category-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  max-width: 900px;
  margin: 0 auto 20px;
  padding: 0 16px;
  justify-content: center;
}
.tab {
  padding: 8px 16px;
  border-radius: 50px;
  border: 2px solid #3498db;
  background: white;
  color: #3498db;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.tab.active {
  background: #3498db;
  color: white;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px 40px;
}
.app-card {
  background: white;
  border-radius: 16px;
  padding: 20px 12px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.app-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.app-icon {
  font-size: 36px;
  margin-bottom: 10px;
  display: block;
}
.app-name {
  font-size: 13px;
  font-weight: bold;
  color: #333;
  line-height: 1.4;
}
.app-count {
  font-size: 11px;
  color: #999;
  margin-top: 4px;
}
.no-result {
  text-align: center;
  padding: 60px;
  color: #999;
  font-size: 16px;
  grid-column: 1/-1;
}
</style>

const CATS = ['すべて','国語','英語','算数・数学','理科','社会','歴史','芸術','文学'];
let currentCat = 'すべて';

function init() {
  const tabs = document.getElementById('tabs');
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c === 'すべて' ? ' active' : '');
    btn.textContent = c;
    btn.onclick = () => {
      currentCat = c;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      filterApps();
    };
    tabs.appendChild(btn);
  });
  filterApps();
}

function filterApps() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = APPS.filter(a => {
    const matchCat = currentCat === 'すべて' || a.cat === currentCat;
    const matchQ = !q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-result">見つかりませんでした</div>';
    return;
  }
  filtered.forEach(a => {
    const card = document.createElement('a');
    card.className = 'app-card';
    card.href = BASE + a.id + '/';
    card.target = '_blank';
    card.innerHTML = `
      <span class="app-icon">${a.icon}</span>
      <div class="app-name">${a.name}</div>
      <div class="app-count">${a.cat}</div>
    `;
    grid.appendChild(card);
  });
}

init();
