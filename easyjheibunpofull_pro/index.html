<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中学英文法 全学年</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f0f4f8;min-height:100vh}
header{background:linear-gradient(135deg,#1a5276,#2980b9);color:white;padding:16px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
header h1{font-size:18px;font-weight:bold;margin-bottom:4px}
header p{font-size:13px;opacity:0.8}
.prog{height:4px;background:rgba(255,255,255,0.3)}
.prog-fill{height:100%;background:white;transition:width 0.3s}
main{padding:16px;max-width:600px;margin:0 auto}
.unit-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.unit-btn{padding:6px 12px;border-radius:20px;border:2px solid #2980b9;background:white;color:#2980b9;font-size:12px;font-weight:bold;cursor:pointer}
.unit-btn.active{background:#2980b9;color:white}
.card{background:white;border-radius:16px;padding:28px 20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.1);text-align:center;min-height:160px;display:flex;flex-direction:column;justify-content:center}
.unit-label{font-size:11px;color:#2980b9;font-weight:bold;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
.q-text{font-size:20px;font-weight:bold;color:#333;line-height:1.6}
.a-box{background:#eaf4fb;border:2px solid #2980b9;border-radius:12px;padding:16px;font-size:20px;font-weight:bold;color:#1a5276;margin-top:12px;display:none;line-height:1.6}
.a-box.show{display:block}
.btn-group{display:flex;gap:10px;margin-bottom:16px}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-show{background:#2980b9;color:white}
.btn-show.hidden{display:none}
.btn-ok{background:#27ae60;color:white;display:none}
.btn-ng{background:#e74c3c;color:white;display:none}
.btn-ok.show,.btn-ng.show{display:block}
.result{display:none;text-align:center;padding:40px 20px}
.result.show{display:block}
.res-icon{font-size:64px;margin-bottom:16px}
.res-score{font-size:28px;font-weight:bold;color:#333;margin-bottom:8px}
.res-sub{font-size:16px;color:#666;margin-bottom:32px}
.btn-restart{background:#2980b9;color:white;padding:16px 40px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
.counter{font-size:13px;opacity:0.9;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>中学英文法 全学年</h1>
  <p class="counter" id="cnt">読み込み中...</p>
</header>
<div class="prog"><div class="prog-fill" id="pf" style="width:0%"></div></div>
<main>
  <div id="qa">
    <div class="unit-bar" id="unitBar"></div>
    <div class="card">
      <div class="unit-label" id="unitLabel"></div>
      <div class="q-text" id="qText">読み込み中...</div>
      <div class="a-box" id="aBox"></div>
    </div>
    <div class="btn-group">
      <button class="btn btn-show" id="bShow" onclick="showAnswer()">答えを見る</button>
      <button class="btn btn-ok" id="bOk" onclick="next(true)">正解！</button>
      <button class="btn btn-ng" id="bNg" onclick="next(false)">もう一度</button>
    </div>
  </div>
  <div class="result" id="result">
    <div class="res-icon">🎉</div>
    <div class="res-score" id="score"></div>
    <div class="res-sub" id="sub"></div>
    <button class="btn-restart" onclick="start()">もう一度</button>
  </div>
</main>

を話せる", "a": "友達"}, {"unit": "5.　関係代名詞", "q": "主語", "a": "私は"}, {"unit": "5.　関係代名詞", "q": "動詞", "a": "います　→　　持っています"}, {"unit": "5.　関係代名詞", "q": "テニスをしている", "a": "あの少年"}, {"unit": "5.　関係代名詞", "q": "主語", "a": "私は"}, {"unit": "5.　関係代名詞", "q": "動詞", "a": "知っています　→　　know"}, {"unit": "6.　代名詞2", "q": "代名詞に self を付けると", "a": "「～自身で」という意味になる"}, {"unit": "6.　代名詞2", "q": "Is Masahiko a student?（雅彦は学生ですか）", "a": "Yes, she is.（はい、そうです）"}, {"unit": "6.　代名詞2", "q": "Is this a book?", "a": "No, it isn't."}, {"unit": "6.　代名詞2", "q": "（５）It is ～ for", "a": "to ～の構文で、形式主語として"}, {"unit": "8.　副詞", "q": "美しい花　　　　　かわいい犬　　　　　速い車", "a": "これらが　　形容詞　である"}, {"unit": "8.　副詞", "q": "動詞は　｢走る　　　食べる　　　寝る　　　勉強する　など", "a": "動きを表す言葉である"}, {"unit": "8.　副詞", "q": "副詞　は", "a": "副詞　を修飾する"}, {"unit": "8.　副詞", "q": "とても", "a": "美しい　のように｢美しい　は形容詞だから　　とても　は形容詞を修飾している副詞"}, {"unit": "8.　副詞", "q": "少し", "a": "小さい"}, {"unit": "8.　副詞", "q": "とても", "a": "上手に"}, {"unit": "8.　副詞", "q": "とてもよく", "a": "知っている"}, {"unit": "8.　副詞", "q": "be動詞の文", "a": "be動詞の後ろに入れる"}, {"unit": "8.　副詞", "q": "一般動詞の文", "a": "一般動詞の前に入れる"}, {"unit": "9.　前置詞", "q": "見渡すことのできる広さ", "a": "狭い場所"}, {"unit": "9.　前置詞", "q": "見渡しきれないくらいの大きさ", "a": "広い場所"}, {"unit": "9.　前置詞", "q": "ポイント　--＞　　　under", "a": "（接触しないで）～の下に"}, {"unit": "9.　前置詞", "q": "over", "a": "（接触しないで）～の上に"}, {"unit": "9.　前置詞", "q": "ポイント　--＞　　　by", "a": "（目の前にあるくらいの距離感で）～のそばに"}, {"unit": "9.　前置詞", "q": "near", "a": "（目の前というほどではないけども）～の近くに"}, {"unit": "9.　前置詞", "q": "ポイント　--＞　　between A and B", "a": "A　と　B　の間（2つの間）"}, {"unit": "9.　前置詞", "q": "among", "a": "（3つ以上）の間"}, {"unit": "9.　前置詞", "q": "ポイント　--＞　　　around", "a": "～の周りを（に）"}, {"unit": "10.　感嘆文", "q": "例１　　　　　　これは / なんて / きれいな / 花 / なんでしょう\n\n\n　　　　 ↑　　　　　　　　 　　↑　　　　 ↑\n　　　 主語　　　　　　　　　形容詞　 　名詞 \n\n名詞があるから　　What　ではじめる", "a": "What a beautiful flower this is !"}];
const UNITS=["1.　be動詞", "１　　be動詞", "2.　一般動詞", "2.　　一般動詞", "3.　否定文・疑問文", "3.　　否定文・疑問文", "4.　疑問詞", "4.　　疑問詞", "5.　命令文", "5.　　命令文", "6.　３人称・単数・現在（３単現）", "6.　　３人称・単数・現在（３単現）", "7.　進行形", "7.　　進行形", "8.　過去形", "8.　　過去形", "9.　名詞の複数形", "10.　代名詞", "11.　形容詞", "12.　文型", "13.　CAN", "13.　　CAN", "1.　未来", "2.　動名詞", "3.　不定詞1", "4.　助動詞", "5.　比較", "6.　接続詞", "7.　受動態（受け身）", "8.　There is～", "1.　現在完了", "2.　不定詞2", "3.　分詞", "4.　間接疑問", "5.　関係代名詞", "6.　代名詞2", "7.　形容詞", "8.　副詞", "9.　前置詞", "10.　感嘆文", "11.　付加疑問"];
let filtered=[],cur=0,ok=0,currentUnit='all';

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function buildUnitBar(){
  const bar=document.getElementById('unitBar');
  // 全体ボタン
  const all=document.createElement('button');
  all.className='unit-btn active';
  all.textContent='全単元';
  all.onclick=()=>setUnit('all',all);
  bar.appendChild(all);
  // 単元ボタン
  UNITS.forEach(u=>{
    const btn=document.createElement('button');
    btn.className='unit-btn';
    btn.textContent=u.replace(/^[0-9０-９\s　]+/,'').trim().slice(0,10);
    btn.title=u;
    btn.onclick=()=>setUnit(u,btn);
    bar.appendChild(btn);
  });
}

function setUnit(unit,btn){
  currentUnit=unit;
  document.querySelectorAll('.unit-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  start();
}

function start(){
  filtered=shuffle(currentUnit==='all'?ALL:ALL.filter(d=>d.unit===currentUnit));
  cur=0;ok=0;
  document.getElementById('qa').style.display='block';
  document.getElementById('result').classList.remove('show');
  show();
}

function show(){
  if(cur>=filtered.length){done();return}
  const d=filtered[cur];
  document.getElementById('unitLabel').textContent=d.unit;
  document.getElementById('qText').textContent=d.q;
  document.getElementById('aBox').textContent=d.a;
  document.getElementById('aBox').classList.remove('show');
  document.getElementById('bShow').classList.remove('hidden');
  document.getElementById('bOk').classList.remove('show');
  document.getElementById('bNg').classList.remove('show');
  document.getElementById('cnt').textContent=(cur+1)+'/'+filtered.length+' 問';
  document.getElementById('pf').style.width=(cur/filtered.length*100)+'%';
}

function showAnswer(){
  document.getElementById('aBox').classList.add('show');
  document.getElementById('bShow').classList.add('hidden');
  document.getElementById('bOk').classList.add('show');
  document.getElementById('bNg').classList.add('show');
}

function next(v){if(v)ok++;cur++;show()}

function done(){
  document.getElementById('qa').style.display='none';
  document.getElementById('result').classList.add('show');
  const p=Math.round(ok/filtered.length*100);
  document.getElementById('score').textContent=ok+'/'+filtered.length+' 正解 ('+p+'%)';
  document.getElementById('sub').textContent=p>=80?'すばらしい！':p>=60?'よくできました！':'繰り返し練習しよう！';
}

buildUnitBar();
start();
</script>
