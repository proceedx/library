<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習アプリ ライブラリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#f8f9ff;min-height:100vh}

/* ヘッダー */
header{
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:white;padding:32px 20px 24px;text-align:center;position:relative;overflow:hidden;
}
header::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at center,rgba(52,152,219,0.15) 0%,transparent 70%);
  animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.header-icon{font-size:48px;margin-bottom:8px;display:block;filter:drop-shadow(0 0 20px rgba(52,152,219,0.8))}
header h1{font-size:26px;font-weight:900;margin-bottom:4px;letter-spacing:2px;position:relative}
header p{font-size:13px;opacity:0.6;position:relative;letter-spacing:1px}
.stats{display:flex;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap;position:relative}
.stat{
  background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);border-radius:16px;
  padding:12px 20px;text-align:center;min-width:80px;
}
.stat-num{font-size:24px;font-weight:900;background:linear-gradient(135deg,#74b9ff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:10px;opacity:0.6;margin-top:2px;letter-spacing:1px}
.total-progress{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin:16px 20px 0;position:relative}
.total-progress-fill{height:100%;background:linear-gradient(90deg,#00b894,#00cec9);border-radius:2px;transition:width 0.8s ease}

/* 検索 */
.search-wrap{max-width:640px;margin:24px auto 0;padding:0 16px}
.search-box{
  position:relative;
  background:white;border-radius:50px;
  box-shadow:0 8px 32px rgba(0,0,0,0.12);
  border:2px solid transparent;
  transition:border-color 0.3s;
}
.search-box:focus-within{border-color:#74b9ff}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px;opacity:0.4}
.search-box input{
  width:100%;padding:16px 20px 16px 48px;border:none;border-radius:50px;
  font-size:15px;background:transparent;outline:none;font-family:'Noto Sans JP',sans-serif;
}

/* フィルターエリア */
.filters{max-width:960px;margin:20px auto 0;padding:0 16px}
.filter-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter-label{
  font-size:11px;font-weight:700;color:#888;letter-spacing:1px;
  min-width:60px;text-transform:uppercase;
}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  padding:6px 14px;border-radius:50px;border:none;
  background:#eee;color:#666;font-size:12px;font-weight:700;
  cursor:pointer;transition:all 0.2s;font-family:'Noto Sans JP',sans-serif;
}
.tab:hover{background:#ddd}
.tab.active{background:linear-gradient(135deg,#0984e3,#74b9ff);color:white;box-shadow:0 4px 12px rgba(9,132,227,0.3)}
.grade-tab{background:#eee;color:#666}
.grade-tab.active-小学{background:linear-gradient(135deg,#00b894,#55efc4);color:white;box-shadow:0 4px 12px rgba(0,184,148,0.3)}
.grade-tab.active-中学{background:linear-gradient(135deg,#0984e3,#74b9ff);color:white;box-shadow:0 4px 12px rgba(9,132,227,0.3)}
.grade-tab.active-高校{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:white;box-shadow:0 4px 12px rgba(108,92,231,0.3)}
.grade-tab.active-その他{background:linear-gradient(135deg,#636e72,#b2bec3);color:white}
.grade-tab.active-すべて{background:linear-gradient(135deg,#2d3436,#636e72);color:white}
.prog-tab{background:#eee;color:#666}
.prog-tab.active{background:linear-gradient(135deg,#00b894,#00cec9);color:white;box-shadow:0 4px 12px rgba(0,184,148,0.3)}

/* 結果情報 */
.result-info{
  max-width:960px;margin:12px auto 0;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.result-count{font-size:13px;color:#888}
.reset-btn{
  padding:6px 14px;background:linear-gradient(135deg,#d63031,#e17055);
  color:white;border:none;border-radius:50px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;
  box-shadow:0 4px 12px rgba(214,48,49,0.3);
}

/* グリッド */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;max-width:960px;margin:16px auto 60px;padding:0 16px;
}

/* カード */
.app-card{
  background:white;border-radius:20px;padding:18px 14px 14px;
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.06);
  transition:transform 0.25s,box-shadow 0.25s;
  border:1px solid rgba(0,0,0,0.04);
}
.app-card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(0,0,0,0.12)}
.app-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
}
.app-card.done{opacity:0.55}
.card-serial{
  position:absolute;top:8px;right:10px;
  font-size:9px;font-weight:700;color:#ccc;letter-spacing:0.5px;
}
.card-done-mark{
  position:absolute;top:8px;left:10px;
  font-size:16px;filter:drop-shadow(0 2px 4px rgba(0,200,100,0.4));
}
.card-icon{font-size:36px;margin:4px 0 10px;display:block;line-height:1}
.card-name{font-size:12px;font-weight:700;color:#2d3436;line-height:1.5;margin-bottom:8px;min-height:36px;display:flex;align-items:center;justify-content:center}
.card-badges{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:9px;padding:2px 7px;border-radius:50px;font-weight:700;letter-spacing:0.3px}
.badge-cat{background:#f0f3ff;color:#6c5ce7}
.badge-grade{font-size:9px;padding:2px 7px;border-radius:50px;font-weight:700}
.badge-count{background:#fff8e1;color:#f39c12}
.card-progress-bar{height:3px;background:#f0f0f0;border-radius:2px;margin-bottom:10px;overflow:hidden}
.card-progress-fill{height:100%;background:linear-gradient(90deg,#00b894,#00cec9);border-radius:2px;transition:width 0.5s}
.card-btns{display:flex;gap:6px}
.btn-open{
  flex:2;padding:8px 4px;
  background:linear-gradient(135deg,#0984e3,#74b9ff);
  color:white;border-radius:10px;font-size:11px;font-weight:700;
  text-decoration:none;text-align:center;
  box-shadow:0 4px 12px rgba(9,132,227,0.25);
  transition:opacity 0.2s;
}
.btn-open:hover{opacity:0.85}
.btn-done{
  flex:1;padding:8px 4px;border:none;border-radius:10px;
  font-size:11px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:opacity 0.2s;
}
.btn-done:hover{opacity:0.85}
.btn-done-off{background:linear-gradient(135deg,#00b894,#00cec9);color:white;box-shadow:0 4px 12px rgba(0,184,148,0.25)}
.btn-done-on{background:#b2bec3;color:white}

/* カテゴリ別ボーダー */
.bc-国語::before{background:linear-gradient(90deg,#e74c3c,#ff7675)}
.bc-英語::before{background:linear-gradient(90deg,#0984e3,#74b9ff)}
.bc-算数・数学::before{background:linear-gradient(90deg,#f39c12,#fdcb6e)}
.bc-理科::before{background:linear-gradient(90deg,#8e44ad,#a29bfe)}
.bc-社会::before{background:linear-gradient(90deg,#00b894,#55efc4)}
.bc-歴史::before{background:linear-gradient(90deg,#8b6914,#e6a817)}
.bc-芸術::before{background:linear-gradient(90deg,#e05c7a,#fd79a8)}
.bc-文学::before{background:linear-gradient(90deg,#2d3436,#636e72)}

.no-result{text-align:center;padding:80px;color:#bbb;font-size:15px;grid-column:1/-1}
.no-result-icon{font-size:48px;display:block;margin-bottom:12px}
.library-link{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 20px;background:linear-gradient(135deg,#fdcb6e,#e17055);color:white;border-radius:50px;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:1px;box-shadow:0 4px 16px rgba(225,112,85,0.4);transition:transform 0.2s;position:relative;}
.library-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(225,112,85,0.5)}
</style>
</head>

const CATS=['すべて','国語','英語','算数・数学','理科','社会','歴史','芸術','文学'];
const GRADES=['すべて','小学','中学','高校','その他'];
const GRADE_COLORS={'小学':'#00b894','中学':'#0984e3','高校':'#6c5ce7','その他':'#636e72'};
const CAT_ICONS={'国語':'📖','英語':'🇬🇧','算数・数学':'📐','理科':'🔬','社会':'🏫','歴史':'📜','芸術':'🎨','文学':'📚','すべて':'✨'};
const PROGRESS_KEY='library_progress_v2';
let currentCat='すべて',currentGrade='すべて',currentProgress='すべて';

function getProgress(){try{return JSON.parse(localStorage.getItem(PROGRESS_KEY))||{};}catch{return {}}}
function saveProgress(p){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}catch{}}
function markDone(appId){const p=getProgress();p[appId]=!p[appId];if(!p[appId])delete p[appId];saveProgress(p);updateStats();filterApps();}
function resetProgress(){if(!confirm('進捗をリセットしますか？'))return;localStorage.removeItem(PROGRESS_KEY);updateStats();filterApps();}

function updateStats(){
  const p=getProgress();
  const done=APPS.filter(a=>p[a.id]).length;
  document.getElementById('doneApps').textContent=done;
  document.getElementById('totalProgress').style.width=(done/APPS.length*100)+'%';
  const total=APPS.reduce((s,a)=>s+a.count,0);
  document.getElementById('totalQ').textContent=total.toLocaleString();
}

function init(){
  updateStats();
  // カテゴリタブ
  const catDiv=document.getElementById('catTabs');
  CATS.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='tab'+(c==='すべて'?' active':'');
    btn.textContent=(CAT_ICONS[c]?CAT_ICONS[c]+' ':'')+c;
    btn.onclick=()=>{
      catDiv.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentCat=c;filterApps();
    };
    catDiv.appendChild(btn);
  });

  // 学年タブ
  const gradeDiv=document.getElementById('gradeTabs');
  GRADES.forEach(g=>{
    const btn=document.createElement('button');
    btn.className='tab grade-tab'+(g==='すべて'?' active-すべて':'');
    btn.textContent=g;
    btn.onclick=()=>{
      gradeDiv.querySelectorAll('button').forEach(b=>{b.className='tab grade-tab'});
      btn.className=`tab grade-tab active-${g}`;
      currentGrade=g;filterApps();
    };
    gradeDiv.appendChild(btn);
  });

  const pfDiv=document.getElementById('progressTabs');
  [['すべて','✨ すべて'],['未学習','📘 未学習'],['学習済み','✅ 学習済み']].forEach(([val,label],i)=>{
    const btn=document.createElement('button');
    btn.className='tab prog-tab'+(i===0?' active':'');
    btn.textContent=label;
    btn.onclick=()=>{
      pfDiv.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentProgress=val;filterApps();
    };
    pfDiv.appendChild(btn);
  });

  filterApps();
}

function filterApps(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const p=getProgress();
  const filtered=APPS.filter(a=>{
    const matchCat=currentCat==='すべて'||a.cat===currentCat;
    const matchGrade=currentGrade==='すべて'||a.grade===currentGrade;
    const matchQ=!q||a.name.toLowerCase().includes(q)||String(a.no).includes(q)||a.cat.includes(q)||a.grade.includes(q);
    const isDone=!!p[a.id];
    const matchProg=currentProgress==='すべて'||(currentProgress==='学習済み'&&isDone)||(currentProgress==='未学習'&&!isDone);
    return matchCat&&matchGrade&&matchQ&&matchProg;
  });

  document.getElementById('showCount').textContent=filtered.length;
  document.getElementById('resultInfo').textContent=`${filtered.length}件表示中`;

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(filtered.length===0){
    grid.innerHTML='<div class="no-result"><span class="no-result-icon">🔍</span>見つかりませんでした</div>';
    return;
  }

  filtered.forEach(a=>{
    const isDone=!!p[a.id];
    const gradeColor=GRADE_COLORS[a.grade]||'#999';
    const serial=String(a.no).padStart(3,'0');
    const card=document.createElement('div');
    card.className=`app-card bc-${a.cat}${isDone?' done':''}`;
    card.innerHTML=`
      <span class="card-serial">[${serial}]</span>
      ${isDone?'<span class="card-done-mark">✅</span>':''}
      <span class="card-icon">${a.icon}</span>
      <div class="card-name">${a.name}</div>
      <div class="card-badges">
        <span class="badge badge-cat">${a.cat}</span>
        <span class="badge badge-grade" style="background:${gradeColor}22;color:${gradeColor}">${a.grade}</span>
        ${a.count>0?`<span class="badge badge-count">${a.count}問</span>`:''}
      </div>
      <div class="card-progress-bar"><div class="card-progress-fill" style="width:${isDone?100:0}%"></div></div>
      <div class="card-btns">
        <a class="btn-open" href="./${a.id}/" target="_blank">開く</a>
        <button class="btn-done ${isDone?'btn-done-on':'btn-done-off'}" onclick="event.stopPropagation();markDone('${a.id}')">${isDone?'済✓':'完了'}</button>
      </div>`;
    grid.appendChild(card);
  });
}

init();
</script>
</body>
</html>
