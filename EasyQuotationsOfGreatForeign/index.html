let questions = [];
let current = 0;
let correct = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  questions = shuffle(ALL_QUESTIONS.filter(q => q.q && q.q.trim()).map(q => (!q.a || !q.a.trim()) ? {q:'問題', hint:q.hint, a:q.q} : q));
  current = 0;
  correct = 0;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  showQuestion();
}

function showQuestion() {
  if (current >= questions.length) {
    showResult();
    return;
  }
  const q = questions[current];
  document.getElementById('questionText').textContent = q.q || '（問題なし）';
  document.getElementById('hintText').textContent = q.hint ? `【${q.hint}】` : '';
  document.getElementById('answerBox').textContent = q.a || '（答えなし）';
  document.getElementById('answerBox').classList.remove('show');
  document.getElementById('btnShow').classList.remove('hidden');
  document.getElementById('btnCorrect').classList.remove('show');
  document.getElementById('btnWrong').classList.remove('show');
  
  document.getElementById('counter').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
}

function showAnswer() {
  document.getElementById('answerBox').classList.add('show');
  document.getElementById('btnShow').classList.add('hidden');
  document.getElementById('btnCorrect').classList.add('show');
  document.getElementById('btnWrong').classList.add('show');
}

function next(isCorrect) {
  if (isCorrect) correct++;
  current++;
  showQuestion();
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultScreen').classList.add('show');
  const pct = Math.round((correct / questions.length) * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 60 ? '😊' : '📚';
  document.getElementById('resultScreen').querySelector('.result-icon').textContent = emoji;
  document.getElementById('resultScore').textContent = `${correct} / ${questions.length} 正解 (${pct}%)`;
  document.getElementById('resultSub').textContent = 
    pct >= 80 ? 'すばらしい！全問制覇まであと少し！' :
    pct >= 60 ? 'よくできました！あと一息！' : 'もう一度チャレンジしてみよう！';
}

function restart() {
  start();
}

// 起動
if (ALL_QUESTIONS.length === 0) {
  document.querySelector('.card').innerHTML = '<div class="no-data">データがありません</div>';
} else {
  start();
}
