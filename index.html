<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #f0f4f8;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #2c3e50, #3498db);
  color: white;
  padding: 24px 20px 16px;
  text-align: center;
}
header h1 { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
header p { font-size: 13px; opacity: 0.8; }
.stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-top: 12px;
}
.stat { text-align: center; }
.stat-num { font-size: 22px; font-weight: bold; }
.stat-label { font-size: 11px; opacity: 0.7; }

.search-box {
  max-width: 600px;
  margin: 16px auto;
  padding: 0 16px;
}
.search-box input {
  width: 100%;
  padding: 14px 20px;
  border: none;
  border-radius: 50px;
  font-size: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  outline: none;
}

.filter-bar {
  max-width: 900px;
  margin: 0 auto 8px;
  padding: 0 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.filter-label { font-size: 12px; color: #666; margin-right: 4px; }
.tab {
  padding: 6px 14px;
  border-radius: 50px;
  border: 2px solid #3498db;
  background: white;
  color: #3498db;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { background: #3498db; color: white; }
.tab:hover { opacity: 0.8; }

.grade-bar {
  max-width: 900px;
  margin: 0 auto 12px;
  padding: 0 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.grade-btn {
  padding: 5px 12px;
  border-radius: 50px;
  border: 2px solid #95a5a6;
  background: white;
  color: #666;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
}
.grade-btn.active { background: #2c3e50; color: white; border-color: #2c3e50; }

.result-info {
  max-width: 900px;
  margin: 0 auto 8px;
  padding: 0 16px;
  font-size: 13px;
  color: #666;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 12px;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 16px 40px;
}
.app-card {
  background: white;
  border-radius: 14px;
  padding: 18px 12px 14px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-decoration: none;
  color: inherit;
  display: block;
  border-top: 4px solid #ddd;
}
.app-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.app-icon { font-size: 32px; margin-bottom: 8px; display: block; }
.app-name { font-size: 13px; font-weight: bold; color: #333; line-height: 1.4; margin-bottom: 6px; }
.app-meta {
  display: flex;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
}
.badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: bold;
}
.badge-cat { background: #eaf4fb; color: #2980b9; }
.badge-grade { background: #eafaf1; color: #27ae60; }
.badge-count { background: #fef9e7; color: #f39c12; }
.no-result {
  text-align: center;
  padding: 60px;
  color: #999;
  font-size: 16px;
  grid-column: 1/-1;
}

/* カテゴリ別ボーダー色 */
.border-国語 { border-top-color: #e74c3c; }
.border-英語 { border-top-color: #3498db; }
.border-算数・数学 { border-top-color: #f39c12; }
.border-理科 { border-top-color: #9b59b6; }
.border-社会 { border-top-color: #27ae60; }
.border-歴史 { border-top-color: #8b6914; }
.border-芸術 { border-top-color: #e05c7a; }
.border-文学 { border-top-color: #2c3e50; }
</style>

const CATS = ['すべて','国語','英語','算数・数学','理科','社会','歴史','芸術','文学'];
const GRADES = ['すべて','小学','中学','高校','その他'];
const GRADE_COLORS = {'小学':'#27ae60','中学':'#2980b9','高校':'#8e44ad','その他':'#7f8c8d'};
let currentCat = 'すべて';
let currentGrade = 'すべて';

function init() {
  // 総問題数
  const total = APPS.reduce((s,a)=>s+a.count,0);
  document.getElementById('totalQ').textContent = total.toLocaleString();

  // カテゴリタブ
  const catDiv = document.getElementById('catTabs');
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c==='すべて'?' active':'');
    btn.textContent = c;
    btn.onclick = () => { currentCat=c; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); filterApps(); };
    catDiv.appendChild(btn);
  });

  // 学年タブ
  const gradeDiv = document.getElementById('gradeTabs');
  GRADES.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'grade-btn' + (g==='すべて'?' active':'');
    btn.textContent = g;
    if(GRADE_COLORS[g]) btn.style.setProperty('--gc', GRADE_COLORS[g]);
    btn.onclick = () => { currentGrade=g; document.querySelectorAll('.grade-btn').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); filterApps(); };
    gradeDiv.appendChild(btn);
  });

  filterApps();
}

function filterApps() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = APPS.filter(a => {
    const matchCat = currentCat==='すべて' || a.cat===currentCat;
    const matchGrade = currentGrade==='すべて' || a.grade===currentGrade;
    const matchQ = !q || a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q) || a.cat.includes(q) || a.grade.includes(q);
    return matchCat && matchGrade && matchQ;
  });

  document.getElementById('showCount').textContent = filtered.length;
  document.getElementById('resultInfo').textContent = `${filtered.length}件表示中`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(filtered.length===0){
    grid.innerHTML='<div class="no-result">見つかりませんでした</div>';
    return;
  }
  filtered.forEach(a => {
    const card = document.createElement('a');
    card.className = `app-card border-${a.cat}`;
    card.href = './' + a.id + '/';
    card.target = '_blank';
    const gradeColor = GRADE_COLORS[a.grade] || '#999';
    card.innerHTML = `
      <span class="app-icon">${a.icon}</span>
      <div class="app-name">${a.name}</div>
      <div class="app-meta">
        <span class="badge badge-cat">${a.cat}</span>
        <span class="badge badge-grade" style="background:${gradeColor}22;color:${gradeColor}">${a.grade}</span>
        ${a.count>0?`<span class="badge badge-count">${a.count}問</span>`:''}
      </div>`;
    grid.appendChild(card);
  });
}

init();
