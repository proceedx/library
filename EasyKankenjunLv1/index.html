  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.3);
  }
  .progress-fill {
    height: 100%;
    background: white;
    transition: width 0.3s;
  }
  
  main { padding: 20px; max-width: 600px; margin: 0 auto; }
  
  .card {
    background: white;
    border-radius: 16px;
    padding: 30px 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    text-align: center;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .question-text {
    font-size: 32px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .hint-text {
    font-size: 14px;
    color: #999;
    margin-top: 4px;
  }
  .answer-box {
    background: #f0f9f0;
    border: 2px solid #e74c3c;
    border-radius: 12px;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #333;
    width: 100%;
    margin-top: 12px;
    display: none;
  }
  .answer-box.show { display: block; }
  
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-show {
    background: #e74c3c;
    color: white;
  }
  .btn-correct {
    background: #27ae60;
    color: white;
    display: none;
  }
  .btn-wrong {
    background: #e74c3c;
    color: white;
    display: none;
  }
  .btn-show.hidden { display: none; }
  .btn-correct.show, .btn-wrong.show { display: block; }
  
  .result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .result-screen.show { display: block; }
  .result-icon { font-size: 64px; margin-bottom: 16px; }
  .result-score { font-size: 28px; font-weight: bold; color: #333; margin-bottom: 8px; }
  .result-sub { font-size: 16px; color: #666; margin-bottom: 32px; }
  .btn-restart {
    background: #e74c3c;
    color: white;
    padding: 16px 40px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  
  .no-data {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 16px;
  }
</style>

  </div>
  
  <div class="result-screen" id="resultScreen">

let questions = [];
let current = 0;
let correct = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  questions = shuffle(ALL_QUESTIONS.filter(q => q.q && q.q.trim() && q.a && q.a.trim()));
  current = 0;
  correct = 0;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultScreen').classList.remove('show');
  showQuestion();
}

function showQuestion() {
  if (current >= questions.length) {
    showResult();
    return;
  }
  const q = questions[current];
  document.getElementById('questionText').textContent = q.q || '（問題なし）';
  document.getElementById('hintText').textContent = q.hint ? `【${q.hint}】` : '';
  document.getElementById('answerBox').textContent = q.a || '（答えなし）';
  document.getElementById('answerBox').classList.remove('show');
  document.getElementById('btnShow').classList.remove('hidden');
  document.getElementById('btnCorrect').classList.remove('show');
  document.getElementById('btnWrong').classList.remove('show');
  
  document.getElementById('counter').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
}

function showAnswer() {
  document.getElementById('answerBox').classList.add('show');
  document.getElementById('btnShow').classList.add('hidden');
  document.getElementById('btnCorrect').classList.add('show');
  document.getElementById('btnWrong').classList.add('show');
}

function next(isCorrect) {
  if (isCorrect) correct++;
  current++;
  showQuestion();
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultScreen').classList.add('show');
  const pct = Math.round((correct / questions.length) * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 60 ? '😊' : '📚';
  document.getElementById('resultScreen').querySelector('.result-icon').textContent = emoji;
  document.getElementById('resultScore').textContent = `${correct} / ${questions.length} 正解 (${pct}%)`;
  document.getElementById('resultSub').textContent = 
    pct >= 80 ? 'すばらしい！全問制覇まであと少し！' :
    pct >= 60 ? 'よくできました！あと一息！' : 'もう一度チャレンジしてみよう！';
}

function restart() {
  start();
}

// 起動
if (ALL_QUESTIONS.length === 0) {
  document.querySelector('.card').innerHTML = '<div class="no-data">データがありません</div>';
} else {
  start();
}
